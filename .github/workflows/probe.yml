name: Розвідка API PowerOn
on:
  workflow_dispatch:
  push:
    paths: ["scripts/probe_poweron.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_poweron.py
      - run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add data/probe && git commit -m "Розвідка API PowerOn" || exit 0
          git pull --rebase && git push
