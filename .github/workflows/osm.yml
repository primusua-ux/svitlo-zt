name: Координати будинків з OpenStreetMap
on:
  workflow_dispatch:
  push:
    paths: ["scripts/fetch_osm.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_osm.py data/osm
      - run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          git add data/osm
          git commit -m "OSM: адресні точки області" || exit 0
          git pull --rebase && git push
