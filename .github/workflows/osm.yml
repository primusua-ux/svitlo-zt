name: Координати будинків з OpenStreetMap
on:
  workflow_dispatch:
  push:
    paths: ["scripts/osm_extract.py", ".github/workflows/osm.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Завантажити витяг України (Geofabrik)
        run: curl -fL --retry 3 -o /tmp/ua.osm.pbf https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
      - name: Вирізати Житомирщину і відфільтрувати
        run: |
          osmium extract -b 27.1,49.5,29.9,51.8 /tmp/ua.osm.pbf -o /tmp/zt.osm.pbf
          osmium tags-filter /tmp/zt.osm.pbf nwr/addr:housenumber n/place w/highway -o /tmp/f.osm.pbf
          osmium export /tmp/f.osm.pbf -f geojsonseq -o /tmp/f.geojsonseq
          ls -la /tmp/*.pbf /tmp/f.geojsonseq
      - run: python3 scripts/osm_extract.py /tmp/f.geojsonseq data/osm
      - run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          git add data/osm
          git commit -m "OSM: адресні точки області" || exit 0
          git pull --rebase && git push
