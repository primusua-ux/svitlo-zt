# Сайт статичний: збірки немає, публікується корінь репозиторію.
[build]
  publish = "."
  command = ""
  # Код 0 = пропустити деплой. Деплоїмо лише коли змінилась сама сторінка.
  # Оновлення графіка (кожні 15 хв) сюди не потрапляють: сторінка читає їх з GitHub.
  # Щоденне оновлення бази адрес (data/pts, data/geo, data/rem, data/index.json) деплой теж не запускає:
  # на безкоштовному плані це 30 деплоїв x 15 кредитів на місяць при ліміті 300.
  # Свіжа база адрес потрапляє на Netlify разом із наступною правкою сторінки.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html sw.js manifest.webmanifest icons og.png vendor netlify.toml"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
