# Сайт переїхав на svitloe.net (GitHub Pages). Netlify показує лише сторінку «Сайт переїхав» з папки moved/:
# повідомлення, автоматичний перехід зі збереженням посилання на адресу й перенесенням «Моїх адрес».
# Будь-яка стара адреса на Netlify веде на цю сторінку (moved/_redirects).
[build]
  publish = "moved"
  command = ""
  # Код 0 = пропустити деплой. Деплой лише коли змінюється сама сторінка переїзду (scripts/netlify-ignore.sh):
  # оновлення графіка й даних, які комітить бот, кредитів Netlify не витрачають.
  ignore = "bash scripts/netlify-ignore.sh"
