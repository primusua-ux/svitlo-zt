# Сайт статичний: збірки немає, публікується корінь репозиторію.
[build]
  publish = "."
  command = ""
  # Код 0 = пропустити деплой. Правило в scripts/netlify-ignore.sh:
  # сторінка виходить на Netlify не частіше ніж раз на 3 доби, база адрес раз на 14 діб,
  # оновлення графіка (кожні 15 хв) деплой не запускають: сторінка читає їх з GitHub.
  # Терміновий деплой: мітка [netlify] у повідомленні коміту.
  ignore = "bash scripts/netlify-ignore.sh"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
